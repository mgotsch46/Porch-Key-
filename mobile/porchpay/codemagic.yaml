workflows:
  ios-testflight:
    name: porchpay iOS → TestFlight
    environment:
      xcode: latest
      node: 20
      groups: [appstore]   # holds APP_STORE_CONNECT_* API key vars
    scripts:
      - cd mobile/porchpay && npm install
      - cd mobile/porchpay && npx cap add ios && npx cap sync ios
      - cd mobile/porchpay/ios/App && xcode-project use-profiles
      - cd mobile/porchpay/ios/App && xcode-project build-ipa --workspace App.xcworkspace --scheme App
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
