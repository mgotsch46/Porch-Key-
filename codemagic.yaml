  porchpay-android:
    <<: *android_base
    name: PorchPay Android → signed AAB
    environment:
      <<: *android_env
      # The Firebase config lives in the appstore group alongside the signing material.
      # Without this the Android builds cannot see GOOGLE_SERVICES_JSON and ship without
      # push — silently, since the step only warns.
      groups:
        - appstore
      android_signing:
        - porchpay_keystore
      vars:
        APP_DIR: porchpay
        ICON_SRC: icon-porchpay.png
        SPLASH_BG: "#F7FBF3"
    scripts:
      - *prep
      - name: Add Android platform + icons
        script: |
          cd "mobile/$APP_DIR"
          sed -i '' "s#PorchPayBuild/DEV#PorchPayBuild/$BUILD_NUMBER#" capacitor.config.json || true
          npx cap add android
          npx @capacitor/assets generate --android --iconBackgroundColor "$SPLASH_BG" --splashBackgroundColor "$SPLASH_BG" || true
          # Notifications only. The app requests no location permission of any kind.
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q 'POST_NOTIFICATIONS' "$MANIFEST" || \
            sed -i 's|<application|<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n\n    <application|' "$MANIFEST"
          # Firebase config for FCM. Upload google-services.json to Codemagic as the
          # environment variable GOOGLE_SERVICES_JSON (base64).
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json
            echo "google-services.json written"
          else
            echo "WARNING: GOOGLE_SERVICES_JSON is not set — this build cannot receive push."
          fi
          npx cap sync android
      - name: Wire release signing into the generated project
        script: |
          cd "mobile/$APP_DIR/android/app"
          cat >> build.gradle <<'EOF'
          android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv("CM_KEYSTORE_PATH"))
                      storePassword System.getenv("CM_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("CM_KEY_ALIAS")
                      keyPassword System.getenv("CM_KEY_PASSWORD")
                  }
              }
              buildTypes { release { signingConfig signingConfigs.release } }
          }
          EOF
      - name: Build the bundle
        script: |
          cd "mobile/$APP_DIR/android"
          ./gradlew bundleRelease
      - name: Refuse to ship a flagged permission
        script: |
          # Requesting any of these is the fastest way to be auto-classified as a
          # predatory lending app on Play. The app needs none of them, but the manifest
          # is generated at build time and a dependency can merge one in without anyone
          # editing a file — so this checks the MERGED manifest, after the build, and
          # fails rather than letting it reach review.
          cd "mobile/$APP_DIR/android"
          BANNED="READ_CONTACTS WRITE_CONTACTS GET_ACCOUNTS READ_EXTERNAL_STORAGE WRITE_EXTERNAL_STORAGE READ_MEDIA_IMAGES READ_MEDIA_VIDEO READ_MEDIA_AUDIO ACCESS_FINE_LOCATION ACCESS_COARSE_LOCATION ACCESS_BACKGROUND_LOCATION READ_PHONE_STATE READ_PHONE_NUMBERS READ_SMS RECEIVE_SMS SEND_SMS READ_CALL_LOG PROCESS_OUTGOING_CALLS QUERY_ALL_PACKAGES REQUEST_INSTALL_PACKAGES SYSTEM_ALERT_WINDOW"
          FOUND=""
          MANIFESTS=$(find app/build -name AndroidManifest.xml 2>/dev/null)
          if [ -z "$MANIFESTS" ]; then echo "No merged manifest found — cannot verify."; exit 1; fi
          for perm in $BANNED; do
            if grep -qh "android.permission.$perm\"" $MANIFESTS; then FOUND="$FOUND $perm"; fi
          done
          echo "--- permissions in the merged manifest ---"
          grep -ho 'android.permission.[A-Z_]*' $MANIFESTS | sort -u
          if [ -n "$FOUND" ]; then
            echo ""
            echo "BUILD STOPPED — flagged permission(s) present:$FOUND"
            echo "Find which dependency merged it in before shipping this."
            exit 1
          fi
          echo ""
          echo "Clean: no flagged permission in the merged manifest."
      - name: Prove the bundle targets API 36
        script: |
          # Google rejected the first submission because the bundle targeted API 34.
          # The default comes from whichever Capacitor version npm resolved, so it is
          # not a constant — it changed under us once and will again. This reads the
          # level out of the MERGED MANIFEST the build actually produced, not out of
          # variables.gradle, which only states the intent.
          cd "mobile/$APP_DIR/android"
          # Only the app's own merged release manifest counts. Library manifests under
          # app/build declare no targetSdkVersion, and taking the highest value across
          # all of them could pass on a file that is not the one being packaged.
          MERGED=$(find app/build -path "*merged_manifest*" -name AndroidManifest.xml 2>/dev/null | grep -i release | head -1)
          [ -z "$MERGED" ] && MERGED=$(find app/build -path "*merged_manifest*" -name AndroidManifest.xml 2>/dev/null | head -1)
          if [ -z "$MERGED" ]; then
            echo "BUILD STOPPED — no merged manifest found, so the target level cannot"
            echo "be verified. Refusing to ship a bundle whose target level is unknown."
            find app/build -name AndroidManifest.xml 2>/dev/null | head -20
            exit 1
          fi
          echo "reading: $MERGED"
          TARGET=$(grep -o 'targetSdkVersion="[0-9]*"' "$MERGED" | grep -o '[0-9]*' | head -1)
          MIN=$(grep -o 'minSdkVersion="[0-9]*"' "$MERGED" | grep -o '[0-9]*' | head -1)
          echo "merged manifest: minSdkVersion=$MIN targetSdkVersion=$TARGET"
          if [ -z "$TARGET" ]; then
            echo "BUILD STOPPED — could not read targetSdkVersion from the merged manifest."
            echo "--- head of the manifest, to show why ---"
            head -5 "$MERGED"
            exit 1
          fi
          if [ "$TARGET" -lt 36 ]; then
            echo "BUILD STOPPED — targets API $TARGET. Google Play requires at least 36"
            echo "for new apps and updates since 31 August 2026. Raise targetSdkVersion"
            echo "in the Capacitor version this build resolves, then rebuild."
            exit 1
          fi
          # The Advertising ID declaration in Play Console says this app does not use it.
          # A dependency can merge the permission in without anyone editing a file, and
          # a mismatch between the manifest and the declaration is a policy problem.
          if grep -qh "com.google.android.gms.permission.AD_ID" $MANIFESTS; then
            echo "BUILD STOPPED — the merged manifest declares AD_ID, but the Play"
            echo "Advertising ID declaration says this app does not use it. Either strip"
            echo "the permission with tools:node=\"remove\" or change the declaration."
            exit 1
          fi
          echo "Targets API $TARGET, and declares no advertising ID. Play will accept this."
    artifacts:
      - mobile/porchpay/android/app/build/outputs/**/*.aab

