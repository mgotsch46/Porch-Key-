# PorchPay mobile builds. Codemagic reads this file from the repo root.
#
# Four workflows: each app, each store. The apps are thin Capacitor shells around the
# live site, so these builds only need to run again when the shell itself changes —
# day-to-day features ship through the normal Railway deploy.
#
# One-time setup in the Codemagic UI (Team settings):
#   1. Integrations → Developer Portal → connect an App Store Connect API key,
#      named exactly:  porchpay-asc
#   2. Code signing identities → Android keystores → upload porchpay-upload.keystore,
#      reference name exactly:  porchpay_keystore
#      (alias porchpay; passwords are in the credentials file Claude handed over)

definitions:
  ios_base: &ios_base
    max_build_duration: 60
    integrations:
      app_store_connect: porchpay-asc
    environment: &ios_env
      xcode: latest
      node: 20
  android_base: &android_base
    max_build_duration: 60
    environment: &android_env
      node: 20
      java: 17

  # The icon is the site's own logo mark, composed per app: green mark on porch cream
  # for the buyer app, white mark on ink for Admin — matching what the web apps show.
  prep: &prep
    name: Install shell and brand assets
    script: |
      cd "mobile/$APP_DIR"
      npm install
      npm install --no-save @capacitor/assets
      mkdir -p assets
      cp "../../mobile/assets/$ICON_SRC" assets/icon-only.png
      cp "../../mobile/assets/$ICON_SRC" assets/icon.png

workflows:
  porchpay-ios:
    <<: *ios_base
    name: PorchPay iOS → TestFlight
    environment:
      <<: *ios_env
      groups:
        - appstore
      vars:
        APP_DIR: porchpay
        BUNDLE_ID: com.porchpay.app
        ICON_SRC: icon-porchpay.png
        SPLASH_BG: "#F7FBF3"
    scripts:
      - *prep
      - name: Add iOS platform + icons
        script: |
          cd "mobile/$APP_DIR"
          # Stamp the build number into the WebView user agent, so the page can report
          # which binary it is running inside. Without this, a web fix and a native fix
          # are indistinguishable from the outside — which cost us most of an evening.
          sed -i '' "s#PorchPayBuild/DEV#PorchPayBuild/$BUILD_NUMBER#" capacitor.config.json
          grep appendUserAgent capacitor.config.json
          npx cap add ios
          npx @capacitor/assets generate --ios --iconBackgroundColor "$SPLASH_BG" --splashBackgroundColor "$SPLASH_BG" || true
          npx cap sync ios
          # TestFlight refuses builds that have not declared their encryption posture.
          # The app uses only standard HTTPS, which is exempt.
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" ios/App/App/Info.plist || \
            /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" ios/App/App/Info.plist
          # Push. The remote-notification background mode lets a notification arriving
          # while the app is closed update the badge.
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" ios/App/App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string remote-notification" ios/App/App/Info.plist || true
          # The aps-environment entitlement is what actually enables APNs on the build.
          ENT=ios/App/App/App.entitlements
          if [ ! -f "$ENT" ]; then
            /usr/libexec/PlistBuddy -c "Save" "$ENT"
          fi
          /usr/libexec/PlistBuddy -c "Add :aps-environment string production" "$ENT" || \
            /usr/libexec/PlistBuddy -c "Set :aps-environment production" "$ENT"
          # The file is written here, but the project is pointed at it LAST — see the
          # signing step. `npx cap sync ios` rewrites project.pbxproj, so wiring it up
          # before the final sync means wiring it up and then losing it, while a check
          # placed in between still passes. That is how a build shipped with a green
          # entitlement check and no entitlement.
          # Firebase needs its plist inside the app bundle. Upload GoogleService-Info.plist
          # to Codemagic as the environment variable GOOGLE_SERVICE_INFO_PLIST (base64).
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > ios/App/App/GoogleService-Info.plist
            echo "GoogleService-Info.plist written"
          else
            echo "WARNING: GOOGLE_SERVICE_INFO_PLIST is not set — this build cannot receive push."
          fi
          # Apple requires a minimum of iOS 15 from Spring 2027 (ITMS-90068).
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*/IPHONEOS_DEPLOYMENT_TARGET = 15.0/g' ios/App/App.xcodeproj/project.pbxproj
          sed -i '' "s/platform :ios, '[0-9.]*'/platform :ios, '15.0'/" ios/App/Podfile || true
          npx cap sync ios
          # THIS is why no iPhone could ever register, and why register() returned
          # neither a token nor an error.
          #
          # PushNotifications.register() calls UIApplication.registerForRemoteNotifications().
          # iOS then hands the token to the AppDelegate. The plugin does not see that
          # callback directly — it observes NotificationCenter for
          # .capacitorDidRegisterForRemoteNotifications, and the AppDelegate is supposed
          # to post it. Capacitor's generated AppDelegate contains no remote-notification
          # methods at all (true in 6 and still true in 8), so the token arrived and was
          # dropped on the floor: no event, no error, silence forever. The plugin's own
          # source even rejects other calls with "event capacitorDidRegisterForRemote-
          # Notifications not called", which is exactly what was happening.
          #
          # Added as an extension rather than edited into the class body, so it does not
          # depend on where the generated file happens to put its closing brace. The
          # selectors are visible to the Objective-C runtime because AppDelegate derives
          # from UIResponder, which is how UIKit finds them.
          if ! grep -q "didRegisterForRemoteNotificationsWithDeviceToken" ios/App/App/AppDelegate.swift; then
          cat >> ios/App/App/AppDelegate.swift <<'EOF'

          // Forward the APNs callbacks to Capacitor. Without these two methods the push
          // plugin waits for an event that is never posted, and registration fails silently.
          extension AppDelegate {
              func application(_ application: UIApplication,
                               didRegisterForRemoteNotificationsWithDeviceToken deviceToken: Data) {
                  NotificationCenter.default.post(name: .capacitorDidRegisterForRemoteNotifications,
                                                  object: deviceToken)
              }

              func application(_ application: UIApplication,
                               didFailToRegisterForRemoteNotificationsWithError error: Error) {
                  NotificationCenter.default.post(name: .capacitorDidFailToRegisterForRemoteNotifications,
                                                  object: error)
              }
          }
          EOF
          fi
          echo "--- AppDelegate remote-notification methods ---"
          grep -c "RemoteNotification" ios/App/App/AppDelegate.swift
      - name: Refuse to ship a flagged permission
        script: |
          # The iOS equivalent: a usage-description key is what lets an app ask at all.
          # None of these should exist in the plist. If one appears, a dependency added
          # it, and App Review will ask why a loan app wants the address book.
          cd "mobile/$APP_DIR"
          PLIST=ios/App/App/Info.plist
          BANNED="NSContactsUsageDescription NSPhotoLibraryUsageDescription NSPhotoLibraryAddUsageDescription NSCameraUsageDescription NSLocationWhenInUseUsageDescription NSLocationAlwaysAndWhenInUseUsageDescription NSLocationAlwaysUsageDescription NSCalendarsUsageDescription NSRemindersUsageDescription NSHealthShareUsageDescription NSMotionUsageDescription NSSpeechRecognitionUsageDescription NSFaceIDUsageDescription"
          FOUND=""
          for key in $BANNED; do
            if /usr/libexec/PlistBuddy -c "Print :$key" "$PLIST" >/dev/null 2>&1; then FOUND="$FOUND $key"; fi
          done
          if [ -n "$FOUND" ]; then
            echo "BUILD STOPPED — permission prompt(s) declared in Info.plist:$FOUND"
            exit 1
          fi
          echo "Clean: the app declares no contacts, photo, camera or location prompt."
      - name: Fetch or create signing files, then build
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          cd "mobile/$APP_DIR/ios/App"
          xcode-project use-profiles
          # Entitle the build for push, HERE, after cap sync and after use-profiles have
          # both finished rewriting the project. Anything earlier gets discarded.
          ENT=App/App.entitlements
          if [ ! -f "$ENT" ]; then
            /usr/libexec/PlistBuddy -c "Save" "$ENT" || printf '%s' \
              '<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd"><plist version="1.0"><dict/></plist>' > "$ENT"
          fi
          /usr/libexec/PlistBuddy -c "Add :aps-environment string production" "$ENT" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :aps-environment production" "$ENT"
          PBX=App.xcodeproj/project.pbxproj
          # iPhone only. Capacitor generates TARGETED_DEVICE_FAMILY = "1,2", which makes
          # the app universal — and App Store Connect then demands a full set of iPad
          # screenshots for a servicing app nobody will use on a tablet. 1 is iPhone.
          sed -i '' 's#TARGETED_DEVICE_FAMILY = "1,2";#TARGETED_DEVICE_FAMILY = "1";#g' "$PBX"
          sed -i '' "s#TARGETED_DEVICE_FAMILY = 1,2;#TARGETED_DEVICE_FAMILY = 1;#g" "$PBX"
          echo "--- device family ---"
          grep -o 'TARGETED_DEVICE_FAMILY = [^;]*;' "$PBX" | sort -u
          if grep -q 'TARGETED_DEVICE_FAMILY = "\?1,2"\?;' "$PBX"; then
            echo "FATAL: still universal — App Store Connect would demand iPad screenshots."
            exit 1
          fi
          if grep -q "CODE_SIGN_ENTITLEMENTS" "$PBX"; then
            sed -i '' 's#CODE_SIGN_ENTITLEMENTS = .*;#CODE_SIGN_ENTITLEMENTS = App/App.entitlements;#g' "$PBX"
          else
            sed -i '' 's#\(PRODUCT_BUNDLE_IDENTIFIER = [^;]*;\)#CODE_SIGN_ENTITLEMENTS = App/App.entitlements;\n\t\t\t\t\1#g' "$PBX"
          fi
          echo "--- push entitlement, as it will actually be signed ---"
          /usr/libexec/PlistBuddy -c "Print" "$ENT"
          grep -c "CODE_SIGN_ENTITLEMENTS = App/App.entitlements;" "$PBX"
          # Both halves, or no build. The file without the reference is ignored; the
          # reference without the key signs an app that cannot register with APNs.
          /usr/libexec/PlistBuddy -c "Print :aps-environment" "$ENT" >/dev/null 2>&1 || {
            echo "FATAL: App.entitlements has no aps-environment key."; exit 1; }
          grep -q "CODE_SIGN_ENTITLEMENTS = App/App.entitlements;" "$PBX" || {
            echo "FATAL: the project does not reference App.entitlements."; exit 1; }
          agvtool new-version -all $BUILD_NUMBER
          # Capacitor 8 builds iOS with Swift Package Manager, not CocoaPods. There is
          # no Podfile and no App.xcworkspace any more — only App.xcodeproj beside a
          # CapApp-SPM package. Asking for a workspace that no longer exists fails the
          # build outright, so this is the project, not the workspace.
          ls -d App.xcworkspace >/dev/null 2>&1 && BUILD_TARGET="--workspace App.xcworkspace" || BUILD_TARGET="--project App.xcodeproj"
          echo "Building with: $BUILD_TARGET"
          xcode-project build-ipa $BUILD_TARGET --scheme App
          # Last word: read the entitlement back out of the signed binary. Everything
          # above describes intent; this is the only check that reads the artefact.
          APPBIN=$(find build/ios -name "*.app" -maxdepth 4 | head -1)
          if [ -n "$APPBIN" ]; then
            echo "--- codesign entitlements on the built app ---"
            codesign -d --entitlements :- "$APPBIN" 2>/dev/null | tee /tmp/ents.txt || true
            grep -q "aps-environment" /tmp/ents.txt || {
              echo "FATAL: the signed app has no aps-environment. Push would be dead on arrival."; exit 1; }
            echo "Push entitlement confirmed in the signed binary."
            # The entitlement only lets the app ASK for a token. The AppDelegate is what
            # catches the answer. Both have to be in the binary or push is dead, and the
            # entitlement check alone passed happily for every build that could never
            # register. Read the selector out of the compiled binary, not the source.
            EXEC="$APPBIN/$(basename "$APPBIN" .app)"
            [ -f "$EXEC" ] || EXEC=$(find "$APPBIN" -maxdepth 1 -type f -perm +111 | head -1)
            echo "--- APNs delegate selectors in $EXEC ---"
            strings "$EXEC" | grep -o "didRegisterForRemoteNotificationsWithDeviceToken\|didFailToRegisterForRemoteNotificationsWithError" | sort -u
            strings "$EXEC" | grep -q "didRegisterForRemoteNotificationsWithDeviceToken" || {
              echo "FATAL: the binary has no didRegisterForRemoteNotificationsWithDeviceToken."
              echo "iOS would hand the token to an AppDelegate that ignores it, and"
              echo "register() would return neither a token nor an error — silently."
              exit 1; }
            echo "APNs delegate callback confirmed in the signed binary."
          fi
    artifacts:
      - mobile/porchpay/ios/App/build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

