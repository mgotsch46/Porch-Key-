          agvtool new-version -all $BUILD_NUMBER
          xcode-project build-ipa --workspace App.xcworkspace --scheme App
    artifacts:
      - mobile/porchpay-admin/ios/App/build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  porchpay-android:
    <<: *android_base
    name: PorchPay Android → signed AAB
    environment:
      <<: *android_env
      android_signing:
        - porchpay_keystore
      vars:
        APP_DIR: porchpay
        ICON_SRC: icon-porchpay.png
        SPLASH_BG: "#F7FBF3"
    scripts:
      - *prep
      - name: Add Android platform + icons
        script: |
          cd "mobile/$APP_DIR"
          npx cap add android
          npx @capacitor/assets generate --android --iconBackgroundColor "$SPLASH_BG" --splashBackgroundColor "$SPLASH_BG" || true
          # Notifications only. The app requests no location permission of any kind.
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q 'POST_NOTIFICATIONS' "$MANIFEST" || \
            sed -i 's|<application|<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n\n    <application|' "$MANIFEST"
          # Firebase config for FCM. Upload google-services.json to Codemagic as the
          # environment variable GOOGLE_SERVICES_JSON (base64).
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json
            echo "google-services.json written"
          else
            echo "WARNING: GOOGLE_SERVICES_JSON is not set — this build cannot receive push."
          fi
          npx cap sync android
      - name: Wire release signing into the generated project
        script: |
          cd "mobile/$APP_DIR/android/app"
          cat >> build.gradle <<'EOF'
          android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv("CM_KEYSTORE_PATH"))
                      storePassword System.getenv("CM_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("CM_KEY_ALIAS")
                      keyPassword System.getenv("CM_KEY_PASSWORD")
                  }
              }
              buildTypes { release { signingConfig signingConfigs.release } }
          }
          EOF
      - name: Build the bundle
        script: |
          cd "mobile/$APP_DIR/android"
          ./gradlew bundleRelease
      - name: Refuse to ship a flagged permission
        script: |
          # Requesting any of these is the fastest way to be auto-classified as a
          # predatory lending app on Play. The app needs none of them, but the manifest
          # is generated at build time and a dependency can merge one in without anyone
          # editing a file — so this checks the MERGED manifest, after the build, and
          # fails rather than letting it reach review.
          cd "mobile/$APP_DIR/android"
          BANNED="READ_CONTACTS WRITE_CONTACTS GET_ACCOUNTS READ_EXTERNAL_STORAGE WRITE_EXTERNAL_STORAGE READ_MEDIA_IMAGES READ_MEDIA_VIDEO READ_MEDIA_AUDIO ACCESS_FINE_LOCATION ACCESS_COARSE_LOCATION ACCESS_BACKGROUND_LOCATION READ_PHONE_STATE READ_PHONE_NUMBERS READ_SMS RECEIVE_SMS SEND_SMS READ_CALL_LOG PROCESS_OUTGOING_CALLS QUERY_ALL_PACKAGES REQUEST_INSTALL_PACKAGES SYSTEM_ALERT_WINDOW"
          FOUND=""
          MANIFESTS=$(find app/build -name AndroidManifest.xml 2>/dev/null)
          if [ -z "$MANIFESTS" ]; then echo "No merged manifest found — cannot verify."; exit 1; fi
          for perm in $BANNED; do
            if grep -qh "android.permission.$perm\"" $MANIFESTS; then FOUND="$FOUND $perm"; fi
          done
          echo "--- permissions in the merged manifest ---"
          grep -ho 'android.permission.[A-Z_]*' $MANIFESTS | sort -u
          if [ -n "$FOUND" ]; then
            echo ""
            echo "BUILD STOPPED — flagged permission(s) present:$FOUND"
            echo "Find which dependency merged it in before shipping this."
            exit 1
          fi
          echo ""
          echo "Clean: no flagged permission in the merged manifest."
    artifacts:
      - mobile/porchpay/android/app/build/outputs/**/*.aab

  porchpay-admin-android:
    <<: *android_base
    name: PorchPay Admin Android → signed AAB
    environment:
      <<: *android_env
      android_signing:
        - porchpay_keystore
      vars:
        APP_DIR: porchpay-admin
        ICON_SRC: icon-porchpay-admin.png
        SPLASH_BG: "#16220D"
    scripts:
