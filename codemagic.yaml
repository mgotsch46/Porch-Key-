# PorchPay mobile builds. Codemagic reads this file from the repo root.
#
# Four workflows: each app, each store. The apps are thin Capacitor shells around the
# live site, so these builds only need to run again when the shell itself changes —
# day-to-day features ship through the normal Railway deploy.
#
# One-time setup in the Codemagic UI (Team settings):
#   1. Integrations → Developer Portal → connect an App Store Connect API key,
#      named exactly:  porchpay-asc
#   2. Code signing identities → Android keystores → upload porchpay-upload.keystore,
#      reference name exactly:  porchpay_keystore
#      (alias porchpay; passwords are in the credentials file Claude handed over)

definitions:
  ios_base: &ios_base
    max_build_duration: 60
    integrations:
      app_store_connect: porchpay-asc
    environment: &ios_env
      xcode: latest
      node: 20
  android_base: &android_base
    max_build_duration: 60
    environment: &android_env
      node: 20
      java: 17

  # The icon is the site's own logo mark, composed per app: green mark on porch cream
  # for the buyer app, white mark on ink for Admin — matching what the web apps show.
  prep: &prep
    name: Install shell and brand assets
    script: |
      cd "mobile/$APP_DIR"
      npm install
      npm install --no-save @capacitor/assets
      mkdir -p assets
      cp "../../mobile/assets/$ICON_SRC" assets/icon-only.png
      cp "../../mobile/assets/$ICON_SRC" assets/icon.png

workflows:
  porchpay-ios:
    <<: *ios_base
    name: PorchPay iOS → TestFlight
    environment:
      <<: *ios_env
      groups:
        - appstore
      vars:
        APP_DIR: porchpay
        BUNDLE_ID: com.porchpay.app
        ICON_SRC: icon-porchpay.png
        SPLASH_BG: "#F7FBF3"
    scripts:
      - *prep
      - name: Add iOS platform + icons
        script: |
          cd "mobile/$APP_DIR"
          npx cap add ios
          npx @capacitor/assets generate --ios --iconBackgroundColor "$SPLASH_BG" --splashBackgroundColor "$SPLASH_BG" || true
          npx cap sync ios
          # TestFlight refuses builds that have not declared their encryption posture.
          # The app uses only standard HTTPS, which is exempt.
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" ios/App/App/Info.plist || \
            /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" ios/App/App/Info.plist
          # Push. The remote-notification background mode lets a notification arriving
          # while the app is closed update the badge.
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" ios/App/App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string remote-notification" ios/App/App/Info.plist || true
          # The aps-environment entitlement is what actually enables APNs on the build.
          ENT=ios/App/App/App.entitlements
          if [ ! -f "$ENT" ]; then
            /usr/libexec/PlistBuddy -c "Save" "$ENT"
          fi
          /usr/libexec/PlistBuddy -c "Add :aps-environment string production" "$ENT" || \
            /usr/libexec/PlistBuddy -c "Set :aps-environment production" "$ENT"
          # Firebase needs its plist inside the app bundle. Upload GoogleService-Info.plist
          # to Codemagic as the environment variable GOOGLE_SERVICE_INFO_PLIST (base64).
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > ios/App/App/GoogleService-Info.plist
            echo "GoogleService-Info.plist written"
          else
            echo "WARNING: GOOGLE_SERVICE_INFO_PLIST is not set — this build cannot receive push."
          fi
          # Apple requires a minimum of iOS 15 from Spring 2027 (ITMS-90068).
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*/IPHONEOS_DEPLOYMENT_TARGET = 15.0/g' ios/App/App.xcodeproj/project.pbxproj
          sed -i '' "s/platform :ios, '[0-9.]*'/platform :ios, '15.0'/" ios/App/Podfile || true
          npx cap sync ios
      - name: Refuse to ship a flagged permission
        script: |
          # The iOS equivalent: a usage-description key is what lets an app ask at all.
          # None of these should exist in the plist. If one appears, a dependency added
          # it, and App Review will ask why a loan app wants the address book.
          cd "mobile/$APP_DIR"
          PLIST=ios/App/App/Info.plist
          BANNED="NSContactsUsageDescription NSPhotoLibraryUsageDescription NSPhotoLibraryAddUsageDescription NSCameraUsageDescription NSLocationWhenInUseUsageDescription NSLocationAlwaysAndWhenInUseUsageDescription NSLocationAlwaysUsageDescription NSCalendarsUsageDescription NSRemindersUsageDescription NSHealthShareUsageDescription NSMotionUsageDescription NSSpeechRecognitionUsageDescription NSFaceIDUsageDescription"
          FOUND=""
          for key in $BANNED; do
            if /usr/libexec/PlistBuddy -c "Print :$key" "$PLIST" >/dev/null 2>&1; then FOUND="$FOUND $key"; fi
          done
          if [ -n "$FOUND" ]; then
            echo "BUILD STOPPED — permission prompt(s) declared in Info.plist:$FOUND"
            exit 1
          fi
          echo "Clean: the app declares no contacts, photo, camera or location prompt."
      - name: Fetch or create signing files, then build
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          cd "mobile/$APP_DIR/ios/App"
          xcode-project use-profiles
          agvtool new-version -all $BUILD_NUMBER
          xcode-project build-ipa --workspace App.xcworkspace --scheme App
    artifacts:
      - mobile/porchpay/ios/App/build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  porchpay-admin-ios:
    <<: *ios_base
    name: PorchPay Admin iOS → TestFlight
    environment:
